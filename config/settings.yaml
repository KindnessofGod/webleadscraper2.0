# Global pipeline settings. Keep pilot values conservative -- see README "Scaling safely".

proxy:
  # DataImpulse residential, country-level targeting (free tier). City-level
  # targeting costs extra -- we filter by search query text instead (see grid configs).
  country: ng
  concurrent_sessions: 8       # start of range given in spec (5-10)
  session_sticky_minutes: 10   # how long one proxy session is reused before rotating

pacing:
  delay_min_seconds: 2
  delay_max_seconds: 8
  captcha_cooldown_minutes: 15
  max_retries: 3
  retry_backoff_base_seconds: 3   # backoff = base * 2^attempt

cost:
  price_usd_per_gb: 1.0
  pilot_ceiling_usd: 4.50        # hard pause threshold for the $5 pilot tier
  global_ceiling_usd: 4.50       # pipeline refuses to spend past this until raised deliberately
  warn_at_fraction: 0.75          # log a warning once 75% of ceiling is consumed

tier1:
  head_request_timeout_seconds: 6
  treat_unresolvable_as_qualified: true  # dead/broken "website" field -> still passed to tier 2

tier2:
  provider: serper                # serper | searlo -- must match TIER2_SEARCH_PROVIDER
  free_quota_monthly: 2500         # serper.dev free tier; set 3000 for searlo
  results_to_check: 8
  fuzzy_match_threshold: 0.55      # difflib ratio on normalized business name vs domain/title
  request_timeout_seconds: 8

scoring:
  hot_threshold: 70
  warm_threshold: 40
  # cold = below warm_threshold

dedup:
  fuzzy_name_threshold: 0.85       # >= this + same city -> auto-merge duplicate
  fuzzy_name_review_threshold: 0.70  # between review and merge thresholds -> flag for manual review

pilot:
  target_leads_min: 200
  target_leads_max: 500
  max_error_rate: 0.15
  bandwidth_ceiling_mb: 1024        # "well under 1GB" per spec section 4
